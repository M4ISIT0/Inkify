<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inkify - Tu Música Offline</title>
    <style>
        /* (Se mantienen los mismos estilos CSS que tenías anteriormente) */
        :root { --fondo-vacio: #0a0a0a; --fondo-tarjetas: #141414; --acento-dorado: #dfb247; --texto-brillante: #ffffff; --texto-apagado: #7a7a7a; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--fondo-vacio); color: var(--texto-brillante); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .app-container { display: flex; flex: 1; height: calc(100vh - 110px); }
        .sidebar { width: 260px; background-color: #000000; padding: 24px; display: flex; flex-direction: column; gap: 25px; border-right: 1px solid #1a1a1a; }
        .logo-area { font-size: 24px; font-weight: 800; color: var(--acento-dorado); letter-spacing: 1px; text-transform: uppercase; }
        .btn-subir { background-color: transparent; color: var(--acento-dorado); border: 2px solid var(--acento-dorado); padding: 12px 20px; border-radius: 25px; cursor: pointer; text-align: center; }
        .main-content { flex: 1; display: flex; padding: 30px; gap: 30px; background: linear-gradient(180deg, rgba(20,20,20,0.8) 0%, var(--fondo-vacio) 100%); overflow: hidden; }
        .seccion-izquierda { flex: 1; overflow-y: auto; padding-right: 10px; }
        .buscador-input { width: 100%; padding: 12px 15px; margin-bottom: 20px; background-color: #1a1a1a; border: 1px solid #333; border-radius: 8px; color: white; outline: none; }
        .seccion-derecha { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-left: 1px solid #1a1a1a; }
        .cassette-box { width: 320px; height: 200px; background-color: #111; border: 4px solid var(--acento-dorado); border-radius: 12px; position: relative; display: flex; align-items: center; justify-content: center; }
        .cassette-label { width: 240px; height: 110px; background-color: #1a1a1a; border: 2px solid #333; display: flex; justify-content: space-around; align-items: center; }
        .wheel { width: 50px; height: 50px; border: 6px dashed var(--acento-dorado); border-radius: 50%; animation: girar 4s linear infinite; animation-play-state: paused; }
        .cassette-box.sonando .wheel { animation-play-state: running; }
        @keyframes girar { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .player-bar { height: 110px; background-color: var(--fondo-tarjetas); border-top: 1px solid #1a1a1a; display: flex; flex-direction: column; justify-content: center; padding: 0 25px; position: fixed; bottom: 0; width: 100%; }
        .progress-container { width: 100%; display: flex; align-items: center; gap: 12px; }
        .progress-bar-normal { appearance: none; width: 100%; height: 5px; background: #2a2a2a; border-radius: 3px; }
        .player-core-layout { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .btn-play { background-color: var(--acento-dorado); border: none; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="sidebar">
            <div class="logo-area">Inkify</div>
            <label class="btn-subir">➕ Subir Canciones <input type="file" id="input-musica" accept="audio/*" multiple style="display: none;"></label>
        </div>
        <div class="main-content">
            <div class="seccion-izquierda">
                <input type="text" id="buscador-musica" class="buscador-input" placeholder="🔍 Buscar...">
                <div class="lista-canciones" id="lista-contenedor"></div>
            </div>
            <div class="seccion-derecha">
                <div class="cassette-box" id="casete-visual"><div class="cassette-label"><div class="wheel"></div><div class="wheel"></div></div></div>
                <div id="casete-titulo-pantalla" style="margin-top: 20px; color: var(--acento-dorado);">NINGUNA CANCIÓN</div>
            </div>
        </div>
    </div>

    <div class="player-bar">
        <div class="progress-container">
            <span class="time-stamp" id="tiempo-actual">0:00</span>
            <input type="range" class="progress-bar-normal" id="barra-progreso" min="0" max="100" value="0">
            <span class="time-stamp" id="tiempo-total">0:00</span>
        </div>
        <div class="player-core-layout">
            <div id="track-title">Ninguna canción</div>
            <div class="player-controls">
                <button id="btn-anterior">⏮</button>
                <button class="btn-play" id="btn-reproducir">▶</button>
                <button id="btn-siguiente">⏭</button>
            </div>
        </div>
    </div>

    <script>
        // Lógica de BD e inicialización...
        let db, audioActual = new Audio(), listaCancionesGlobal = [], indiceActual = -1, filaReproduccion = [];
        
        const request = indexedDB.open("InkifyDB", 1);
        request.onupgradeneeded = e => e.target.result.createObjectStore("canciones", { keyPath: "id", autoIncrement: true });
        request.onsuccess = e => { db = e.target.result; cargarCanciones(); };

        function actualizarPosicionMedia() {
            if ('mediaSession' in navigator && navigator.mediaSession.setPositionState) {
                navigator.mediaSession.setPositionState({
                    duration: audioActual.duration,
                    playbackRate: audioActual.playbackRate,
                    position: audioActual.currentTime
                });
            }
        }

        function configurarMediaSession(cancion) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({ title: cancion.nombre, artist: 'Inkify Player' });
                navigator.mediaSession.setActionHandler('play', () => { audioActual.play(); });
                navigator.mediaSession.setActionHandler('pause', () => { audioActual.pause(); });
                navigator.mediaSession.setActionHandler('previoustrack', () => btnAnterior.click());
                navigator.mediaSession.setActionHandler('nexttrack', () => btnSiguiente.click());
                
                // NUEVO: Permite mover la barra desde la notificación
                navigator.mediaSession.setActionHandler('seekto', (details) => {
                    audioActual.currentTime = details.seekTime;
                    actualizarPosicionMedia();
                });
            }
        }

        audioActual.addEventListener('timeupdate', () => {
            const porcentaje = (audioActual.currentTime / audioActual.duration) * 100;
            document.getElementById('barra-progreso').value = porcentaje;
            actualizarPosicionMedia(); // Mantiene la barra de la notificación al día
        });

        function reproducirCancion(cancion) {
            audioActual.pause();
            audioActual.currentTime = 0;
            const blob = new Blob([cancion.archivoBlob], { type: "audio/mp3" });
            audioActual.src = URL.createObjectURL(blob);
            audioActual.play();
            document.getElementById('track-title').innerText = cancion.nombre;
            configurarMediaSession(cancion);
            document.getElementById('casete-visual').classList.add('sonando');
        }

        // ... (resto de funciones de cargarCanciones, eliminar, etc.)
    </script>
</body>
</html>
