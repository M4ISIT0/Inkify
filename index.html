<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inkify - Tu Música Offline</title>
    <style>
        /* Paleta de colores estilo Inkify (Oscuro y Dorado) */
        :root {
            --fondo-vacio: #0a0a0a;       
            --fondo-tarjetas: #141414;    
            --acento-dorado: #dfb247;     
            --texto-brillante: #ffffff;   
            --texto-apagado: #7a7a7a;     
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--fondo-vacio);
            color: var(--texto-brillante);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Contenedor de la app */
        .app-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 110px); 
        }

        /* Barra Lateral */
        .sidebar {
            width: 260px;
            background-color: #000000;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            border-right: 1px solid #1a1a1a;
            z-index: 10;
        }

        .logo-area {
            font-size: 24px;
            font-weight: 800;
            color: var(--acento-dorado);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn-subir {
            background-color: transparent;
            color: var(--acento-dorado);
            border: 2px solid var(--acento-dorado);
            padding: 12px 20px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(223, 178, 71, 0.1);
        }

        .btn-subir:hover {
            background-color: var(--acento-dorado);
            color: #000;
            box-shadow: 0 0 15px rgba(223, 178, 71, 0.4);
        }

        /* Contenido Principal */
        .main-content {
            flex: 1;
            display: flex;
            padding: 30px;
            gap: 30px;
            background: linear-gradient(180deg, rgba(20,20,20,0.8) 0%, var(--fondo-vacio) 100%);
            overflow: hidden;
        }

        .seccion-izquierda {
            flex: 1;
            overflow-y: auto;
            padding-right: 10px;
            display: flex;
            flex-direction: column;
        }

        /* BUSCADOR */
        .buscador-input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 20px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: var(--texto-brillante);
            font-size: 14px;
            outline: none;
            transition: 0.3s ease;
        }

        .buscador-input:focus {
            border-color: var(--acento-dorado);
            box-shadow: 0 0 8px rgba(223, 178, 71, 0.2);
            background-color: #222;
        }

        .buscador-input::placeholder {
            color: var(--texto-apagado);
        }

        /* DISEÑO DE LA ZONA DEL CASSETE */
        .seccion-derecha {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-left: 1px solid #1a1a1a;
            padding-left: 20px;
        }

        .cassette-box {
            width: 320px;
            height: 200px;
            background-color: #111111;
            border: 4px solid var(--acento-dorado);
            border-radius: 12px;
            position: relative;
            box-shadow: 0 0 30px rgba(223, 178, 71, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: 0.5s ease;
        }

        .cassette-label {
            width: 240px;
            height: 110px;
            background-color: #1a1a1a;
            border: 2px solid #333;
            border-radius: 6px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .wheel {
            width: 50px;
            height: 50px;
            border: 6px dashed var(--acento-dorado);
            border-radius: 50%;
            background-color: #000;
            position: relative;
            animation: girar 4s linear infinite;
            animation-play-state: paused; 
        }

        .wheel::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 16px;
            height: 16px;
            background-color: var(--fondo-vacio);
            border-radius: 50%;
        }

        .cassette-text {
            position: absolute;
            bottom: 8px;
            font-size: 10px;
            color: var(--acento-dorado);
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @keyframes girar {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .cassette-box.sonando {
            box-shadow: 0 0 40px rgba(223, 178, 71, 0.4);
            border-color: #ffffff;
        }
        .cassette-box.sonando .wheel {
            animation-play-state: running; 
        }

        .lista-canciones {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-accion {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 5px;
            transition: 0.2s;
            color: #7a7a7a;
        }
        
        .btn-accion.editar:hover { color: var(--acento-dorado); transform: scale(1.1); }
        .btn-accion.borrar:hover { color: #ff4444; transform: scale(1.1); }

        /* Barra del Reproductor Inferior */
        .player-bar {
            height: 110px;
            background-color: var(--fondo-tarjetas);
            border-top: 1px solid #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 25px;
            position: fixed;
            bottom: 0;
            width: 100%;
            z-index: 10;
        }

        .progress-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .time-stamp {
            font-size: 11px;
            color: var(--texto-apagado);
            font-family: monospace;
            min-width: 35px;
        }

        .progress-bar-normal {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 5px;
            background: #2a2a2a; 
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        .progress-bar-normal::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--acento-dorado);
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .progress-bar-normal::-webkit-slider-thumb:hover { transform: scale(1.2); }

        .player-core-layout {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .track-info { width: 30%; }

        #track-title {
            font-weight: 600;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #track-artist {
            font-size: 12px;
            color: var(--texto-apagado);
            margin-top: 2px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40%;
        }

        .control-buttons {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .btn-play {
            background-color: var(--acento-dorado);
            color: #000;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-play:hover {
            transform: scale(1.05);
            box-shadow: 0 0 12px var(--acento-dorado);
        }

        .volume-area {
            width: 30%;
            text-align: right;
            color: var(--texto-apagado);
            font-size: 14px;
        }
        @media (max-width: 768px) {
            .app-container { flex-direction: column; height: auto; }
            .sidebar { width: 100%; height: auto; flex-direction: row; padding: 10px; justify-content: space-between; }
            .logo-area { font-size: 18px; }
            .btn-subir { padding: 8px 15px; font-size: 12px; }
            .main-content { flex-direction: column; padding: 10px; gap: 10px; }
            .seccion-izquierda, .seccion-derecha { width: 100%; border: none; }
            .cassette-box { width: 100%; max-width: 280px; height: 140px; margin: 0 auto; }
            .player-bar { position: relative; height: auto; padding: 10px; margin-bottom: 20px; }
            .player-core-layout { flex-direction: column; gap: 10px; }
            #track-title { max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="sidebar">
            <div class="logo-area">Inkify</div>
            <h3 style="font-size: 14px; color: var(--texto-apagado); text-transform: uppercase; letter-spacing: 1px;">Tu Biblioteca</h3>
            
            <label class="btn-subir">
                ➕ Subir Canciones
                <input type="file" id="input-musica" accept="audio/*" multiple style="display: none;">
            </label>
        </div>

        <div class="main-content">
            <div class="seccion-izquierda">
                <div style="font-size: 20px; font-weight: bold; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
                    Mis Canciones
                </div>
                
                <input type="text" id="buscador-musica" class="buscador-input" placeholder="🔍 Buscar por nombre de canción...">

                <p id="mensaje-vacio" style="color: var(--texto-apagado);">Tu biblioteca está en el vacío. Sube archivos .mp3 para empezar a escuchar.</p>
                <div class="lista-canciones" id="lista-contenedor"></div>
            </div>

            <div class="seccion-derecha">
                <div class="cassette-box" id="casete-visual">
                    <div class="cassette-label">
                        <div class="wheel"></div>
                        <div class="wheel"></div>
                        <div class="cassette-text" id="casete-estado">IDLE</div>
                    </div>
                </div>
                <div id="casete-titulo-pantalla" style="margin-top: 20px; font-weight: bold; color: var(--acento-dorado); text-align: center; font-size: 14px; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                    NINGUNA CANCIÓN REPRODUCIENDO
                </div>
            </div>
        </div>
    </div>

    <div class="player-bar">
        <div class="progress-container">
            <span class="time-stamp" id="tiempo-actual">0:00</span>
            <input type="range" class="progress-bar-normal" id="barra-progreso" min="0" max="100" value="0">
            <span class="time-stamp" id="tiempo-total">0:00</span>
        </div>

        <div class="player-core-layout">
            <div class="track-info">
                <div id="track-title">Ninguna canción seleccionada</div>
                <div id="track-artist">Inkify Player</div>
            </div>

            <div class="player-controls">
                <div class="control-buttons">
                    <button class="btn-control" id="btn-shuffle" style="background:none; border:none; color:#7a7a7a; font-size:18px; cursor:pointer; transition: 0.2s;">🔀</button>
                    <button class="btn-control" id="btn-anterior" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">⏮</button>
                    <button class="btn-play" id="btn-reproducir">▶</button>
                    <button class="btn-control" id="btn-siguiente" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">⏭</button>
                </div>
            </div>

            <div class="volume-area">
                🔊 Almacenamiento Local
            </div>
        </div>
    </div>

    <script>
        let db;
        let listaCancionesGlobal = []; 
        let filaReproduccion = [];       
        let indiceActual = -1;         
        let modoAleatorio = false;     

        const request = indexedDB.open("InkifyDB", 1);

        request.onupgradeneeded = function(e) {
            db = e.target.result;
            if (!db.objectStoreNames.contains("canciones")) {
                db.createObjectStore("canciones", { keyPath: "id", autoIncrement: true });
            }
        };

        request.onsuccess = function(e) {
            db = e.target.result;
            console.log("¡InkifyDB conectada!");
            cargarCanciones();
        };

        const inputMusica = document.getElementById('input-musica');
        const buscadorMusica = document.getElementById('buscador-musica');
        const listaContenedor = document.getElementById('lista-contenedor');
        const mensajeVacio = document.getElementById('mensaje-vacio');
        
        const trackTitle = document.getElementById('track-title');
        const caseteVisual = document.getElementById('casete-visual');
        const caseteEstado = document.getElementById('casete-estado');
        const caseteTituloPantalla = document.getElementById('casete-titulo-pantalla');

        const barraProgreso = document.getElementById('barra-progreso');
        const tiempoActualTxt = document.getElementById('tiempo-actual');
        const tiempoTotalTxt = document.getElementById('tiempo-total');

        const nuevoBtnReproducir = document.getElementById('btn-reproducir');
        const btnShuffle = document.getElementById('btn-shuffle');
        const btnAnterior = document.getElementById('btn-anterior');
        const btnSiguiente = document.getElementById('btn-siguiente');

        let audioActual = new Audio();

        function actualizarCasete(estado) {
            if (estado === "PLAYING") {
                caseteVisual.classList.add('sonando');
                caseteEstado.innerText = "PLAYING";
                caseteEstado.style.color = "#ffffff";
            } else if (estado === "PAUSED") {
                caseteVisual.classList.remove('sonando');
                caseteEstado.innerText = "PAUSED";
                caseteEstado.style.color = "var(--acento-dorado)";
            } else {
                caseteVisual.classList.remove('sonando');
                caseteEstado.innerText = "IDLE";
                caseteTituloPantalla.innerText = "NINGUNA CANCIÓN REPRODUCIENDO";
                caseteEstado.style.color = "var(--acento-dorado)";
            }
        }

        function formatearTiempo(segundos) {
            if (isNaN(segundos)) return "0:00";
            const min = Math.floor(segundos / 60);
            const seg = Math.floor(segundos % 60);
            return `${min}:${seg < 10 ? '0' : ''}${seg}`;
        }

        // --- MEDIA SESSION API (Control de flechas en la notificación del celular) ---
        function configurarMediaSession(nombreCancion) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: nombreCancion,
                    artist: 'Inkify Player',
                    album: 'Mi Música Offline'
                });

                navigator.mediaSession.setActionHandler('play', function() {
                    audioActual.play();
                    actualizarCasete("PLAYING");
                    nuevoBtnReproducir.innerText = "⏸";
                });

                navigator.mediaSession.setActionHandler('pause', function() {
                    audioActual.pause();
                    actualizarCasete("PAUSED");
                    nuevoBtnReproducir.innerText = "▶";
                });

                navigator.mediaSession.setActionHandler('previoustrack', function() {
                    btnAnterior.click();
                });

                navigator.mediaSession.setActionHandler('nexttrack', function() {
                    btnSiguiente.click();
                });
            }
        }

        audioActual.addEventListener('timeupdate', function() {
            if (!isNaN(audioActual.duration)) {
                const porcentaje = (audioActual.currentTime / audioActual.duration) * 100;
                barraProgreso.value = porcentaje;
                tiempoActualTxt.innerText = formatearTiempo(audioActual.currentTime);
                barraProgreso.style.background = `linear-gradient(to right, var(--acento-dorado) 0%, var(--acento-dorado) ${porcentaje}%, #2a2a2a ${porcentaje}%, #2a2a2a 100%)`;
            }
        });

        audioActual.addEventListener('loadedmetadata', function() {
            tiempoTotalTxt.innerText = formatearTiempo(audioActual.duration);
            barraProgreso.value = 0;
            barraProgreso.style.background = "#2a2a2a";
        });

        barraProgreso.addEventListener('input', function() {
            if (audioActual.duration) {
                const nuevoTiempo = (barraProgreso.value / 100) * audioActual.duration;
                audioActual.currentTime = nuevoTiempo;
                const porcentaje = barraProgreso.value;
                barraProgreso.style.background = `linear-gradient(to right, var(--acento-dorado) 0%, var(--acento-dorado) ${porcentaje}%, #2a2a2a ${porcentaje}%, #2a2a2a 100%)`;
            }
        });

        inputMusica.addEventListener('change', function(e) {
            const archivos = e.target.files;
            let subidos = 0;
            
            for (let i = 0; i < archivos.length; i++) {
                const archivo = archivos[i];
                const lector = new FileReader();
                
                lector.onload = function(evento) {
                    const transaccion = db.transaction(["canciones"], "readwrite");
                    const almacen = transaccion.objectStore("canciones");
                    
                    const nuevaCancion = {
                        nombre: archivo.name.replace(/\.[^/.]+$/, ""),
                        archivoBlob: evento.target.result
                    };
                    
                    almacen.add(nuevaCancion);
                    
                    transaccion.oncomplete = function() {
                        subidos++;
                        if (subidos === archivos.length) {
                            cargarCanciones();
                        }
                    };
                };
                lector.readAsArrayBuffer(archivo);
            }
        });

        buscadorMusica.addEventListener('input', function() {
            const query = this.value.toLowerCase().trim();
            
            if (!query) {
                renderizarLista(listaCancionesGlobal);
                return;
            }

            let filtradas = listaCancionesGlobal.filter(c => c.nombre.toLowerCase().includes(query));

            filtradas.sort((a, b) => {
                const aEmpieza = a.nombre.toLowerCase().startsWith(query);
                const bEmpieza = b.nombre.toLowerCase().startsWith(query);
                
                if (aEmpieza && !bEmpieza) return -1;
                if (!aEmpieza && bEmpieza) return 1;
                return 0;
            });

            renderizarLista(filtradas);
        });

        function cargarCanciones() {
            const transaccion = db.transaction(["canciones"], "readonly");
            const almacen = transaccion.objectStore("canciones");
            const peticion = almacen.getAll();

            peticion.onsuccess = function() {
                listaCancionesGlobal = peticion.result;

                if (listaCancionesGlobal.length === 0) {
                    mensajeVacio.style.display = "block";
                    buscadorMusica.style.display = "none";
                    filaReproduccion = [];
                    indiceActual = -1;
                    actualizarCasete("IDLE");
                    tiempoActualTxt.innerText = "0:00";
                    tiempoTotalTxt.innerText = "0:00";
                    barraProgreso.value = 0;
                    barraProgreso.style.background = "#2a2a2a";
                    listaContenedor.innerHTML = "";
                    return;
                }

                mensajeVacio.style.display = "none";
                buscadorMusica.style.display = "block";

                if (!modoAleatorio) {
                    filaReproduccion = [...listaCancionesGlobal];
                }

                buscadorMusica.dispatchEvent(new Event('input'));
            };
        }

        function renderizarLista(cancionesARenderizar) {
            listaContenedor.innerHTML = "";

            if(cancionesARenderizar.length === 0 && listaCancionesGlobal.length > 0) {
                listaContenedor.innerHTML = `<p style="color: var(--texto-apagado); text-align:center; padding: 20px;">No se encontraron canciones con esa búsqueda.</p>`;
                return;
            }

            cancionesARenderizar.forEach((cancion) => {
                const div = document.createElement('div');
                div.style.backgroundColor = '#141414';
                div.style.padding = '12px 20px';
                div.style.borderRadius = '8px';
                div.style.display = 'flex';
                div.style.justifyContent = 'space-between';
                div.style.alignItems = 'center';
                div.style.cursor = 'pointer';
                div.style.border = '1px solid #222';
                div.style.transition = '0.2s';

                div.innerHTML = `
                    <div class="info-click" style="flex: 1; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 15px;">🎵 ${cancion.nombre}</div>
                    <div style="display: flex; gap: 8px;">
                        <button class="btn-accion editar" title="Renombrar">✏️</button>
                        <button class="btn-accion borrar" title="Eliminar">🗑️</button>
                    </div>
                `;

                div.onmouseenter = () => div.style.borderColor = '#dfb247';
                div.onmouseleave = () => div.style.borderColor = '#222';

                div.querySelector('.info-click').onclick = function() {
                    if (modoAleatorio) {
                        generarFilaAleatoriaFija(cancion.id);
                    } else {
                        filaReproduccion = [...listaCancionesGlobal];
                        indiceActual = filaReproduccion.findIndex(c => c.id === cancion.id);
                    }
                    reproducirCancion(filaReproduccion[indiceActual]);
                };

                div.querySelector('.editar').onclick = function(e) {
                    e.stopPropagation();
                    renombrarCancion(cancion.id, cancion.nombre);
                };

                div.querySelector('.borrar').onclick = function(e) {
                    e.stopPropagation(); 
                    eliminarCancion(cancion.id);
                };

                listaContenedor.appendChild(div);
            });
        }

        function renombrarCancion(id, nombreActual) {
            const nuevoNombre = prompt("📝 Escribe el nuevo nombre de la canción:", nombreActual);
            
            if (nuevoNombre && nuevoNombre.trim() !== "" && nuevoNombre !== nombreActual) {
                const transaccion = db.transaction(["canciones"], "readwrite");
                const almacen = transaccion.objectStore("canciones");
                const peticionGet = almacen.get(id);
                
                peticionGet.onsuccess = function() {
                    const cancionData = peticionGet.result;
                    cancionData.nombre = nuevoNombre.trim();
                    
                    const peticionPut = almacen.put(cancionData);
                    
                    peticionPut.onsuccess = function() {
                        if (indiceActual !== -1 && filaReproduccion[indiceActual] && filaReproduccion[indiceActual].id === id) {
                            trackTitle.innerText = cancionData.nombre;
                            caseteTituloPantalla.innerText = cancionData.nombre.toUpperCase();
                            configurarMediaSession(cancionData.nombre);
                        }
                        cargarCanciones();
                    };
                };
            }
        }

        function eliminarCancion(id) {
            if (confirm("¿Quieres eliminar esta canción de Inkify?")) {
                const transaccion = db.transaction(["canciones"], "readwrite");
                const almacen = transaccion.objectStore("canciones");
                almacen.delete(id);

                transaccion.oncomplete = function() {
                    if (indiceActual !== -1 && filaReproduccion[indiceActual] && filaReproduccion[indiceActual].id === id) {
                        audioActual.pause();
                        audioActual.currentTime = 0;
                        trackTitle.innerText = "Ninguna canción seleccionada";
                        nuevoBtnReproducir.innerText = "▶";
                        actualizarCasete("IDLE");
                        tiempoActualTxt.innerText = "0:00";
                        tiempoTotalTxt.innerText = "0:00";
                        barraProgreso.value = 0;
                        barraProgreso.style.background = "#2a2a2a";
                    }
                    cargarCanciones();
                };
            }
        }

        function reproducirCancion(cancion) {
            if (!cancion) return;

            // CORRECCIÓN: Limpiar el reproductor para que cada canción empiece limpia en 0:00
            audioActual.pause();
            audioActual.currentTime = 0;

            const blob = new Blob([cancion.archivoBlob], { type: "audio/mp3" });
            const urlAudio = URL.createObjectURL(blob);
            
            audioActual.src = urlAudio;
            audioActual.play();
            
            trackTitle.innerText = cancion.nombre;
            caseteTituloPantalla.innerText = cancion.nombre.toUpperCase();
            nuevoBtnReproducir.innerText = "⏸";
            actualizarCasete("PLAYING");

            // Activar Media Session para la notificación del celular
            configurarMediaSession(cancion.nombre);
        }

        nuevoBtnReproducir.onclick = function() {
            if (audioActual.src) {
                if (audioActual.paused) {
                    audioActual.play();
                    nuevoBtnReproducir.innerText = "⏸";
                    actualizarCasete("PLAYING");
                } else {
                    audioActual.pause();
                    nuevoBtnReproducir.innerText = "▶";
                    actualizarCasete("PAUSED");
                }
            }
        };

        btnSiguiente.onclick = function() {
            if (filaReproduccion.length === 0) return;

            if (indiceActual === filaReproduccion.length - 1) {
                audioActual.pause();
                audioActual.currentTime = 0;
                audioActual.src = "";
                nuevoBtnReproducir.innerText = "▶";
                trackTitle.innerText = "Playlist finalizada";
                indiceActual = -1;
                actualizarCasete("IDLE");
                if (modoAleatorio) generarFilaAleatoriaFija();
                return;
            } else {
                indiceActual++;
            }
            reproducirCancion(filaReproduccion[indiceActual]);
        };

        btnAnterior.onclick = function() {
            if (filaReproduccion.length === 0 || indiceActual === -1) return;

            if (indiceActual === 0) {
                if (!modoAleatorio) {
                    indiceActual = filaReproduccion.length - 1;
                } else {
                    return; 
                }
            } else {
                indiceActual--;
            }
            reproducirCancion(filaReproduccion[indiceActual]);
        };

        function generarFilaAleatoriaFija(idInicial = null) {
            if (listaCancionesGlobal.length === 0) return;

            let copias = [...listaCancionesGlobal];
            let cancionInicial = null;

            if (idInicial !== null) {
                const idx = copias.findIndex(c => c.id === idInicial);
                if (idx !== -1) {
                    cancionInicial = copias.splice(idx, 1)[0];
                }
            } else if (indiceActual !== -1 && filaReproduccion[indiceActual]) {
                const idActual = filaReproduccion[indiceActual].id;
                const idx = copias.findIndex(c => c.id === idActual);
                if (idx !== -1) {
                    cancionInicial = copias.splice(idx, 1)[0];
                }
            }

            for (let i = copias.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copias[i], copias[j]] = [copias[j], copias[i]];
            }

            if (cancionInicial) {
                filaReproduccion = [cancionInicial, ...copias];
                indiceActual = 0;
            } else {
                filaReproduccion = copias;
                indiceActual = 0;
            }
        }

        btnShuffle.onclick = function() {
            if (listaCancionesGlobal.length === 0) return;

            modoAleatorio = !modoAleatorio;
            
            if (modoAleatorio) {
                btnShuffle.style.color = "#dfb247"; 
                btnShuffle.style.textShadow = "0 0 8px #dfb247";
                generarFilaAleatoriaFija();
                if (indiceActual !== -1) reproducirCancion(filaReproduccion[indiceActual]);
            } else {
                btnShuffle.style.color = "#7a7a7a"; 
                btnShuffle.style.textShadow = "none";
                
                let cancionActualId = filaReproduccion[indiceActual]?.id;
                filaReproduccion = [...listaCancionesGlobal];
                if (cancionActualId) {
                    indiceActual = filaReproduccion.findIndex(c => c.id === cancionActualId);
                }
            }
        };

        audioActual.onended = function() {
            btnSiguiente.click();
        };
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker registrado con éxito'))
                .catch((error) => console.log('Error al registrar:', error));
        }
    </script>
</body>
